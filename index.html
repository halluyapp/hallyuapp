<script>
(function(){
var shown=false,bundleFailed=false,n=0;
function root(){return document.getElementById("root");}
function remove(){var e=document.getElementById("hallyu-startup-fallback");if(e&&e.parentNode)e.parentNode.removeChild(e);}
/* The splash lives inside #root, so an empty root is not the only stall: it can also stay on screen. */
function starting(){var r=root();return !!(r&&r.innerHTML.indexOf("Hallyu is starting")!==-1);}
function show(){
  if(shown)return;
  var r=root();
  if(r&&r.children.length&&!starting())return;
  shown=true;
  var host=document.body||document.documentElement;
  var el=document.createElement("div");
  el.id="hallyu-startup-fallback";
  el.setAttribute("role","alert");
  el.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;background:#000;color:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;";
  var t=document.createElement("div");
  t.style.cssText="font-size:17px;font-weight:600;line-height:24px;max-width:420px;";
  t.textContent="Hallyu could not start just now.";
  var s=document.createElement("div");
  s.style.cssText="font-size:14px;line-height:21px;color:#8E8E93;max-width:420px;";
  s.textContent=bundleFailed?"A newer version of Hallyu was published while this page was open, and this copy of the app is no longer available. Tap Reload to get the new one.":"The app did not finish loading on this connection. Tap Reload to try again.";
  var b=document.createElement("button");
  b.type="button";
  b.textContent="Reload";
  b.style.cssText="margin-top:6px;padding:12px 28px;border:0;border-radius:999px;background:#E11D48;color:#fff;font-size:15px;font-weight:600;cursor:pointer;";
  b.onclick=function(){
    var go=function(){location.reload();};
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).catch(function(){}).then(go,go);
    }else{go();}
  };
  el.appendChild(t);el.appendChild(s);el.appendChild(b);
  host.appendChild(el);
}
window.addEventListener("error",function(e){
  var t=e&&e.target;
  if(t&&t.tagName==="SCRIPT"&&t.src&&/\.js(\?|$)/.test(t.src)){bundleFailed=true;setTimeout(show,1200);}
},true);
var timer=setInterval(function(){
  var r=root();
  if(r&&r.children.length&&!starting()){clearInterval(timer);remove();return;}
  n++;
  if(!shown&&n>=50)show();
},300);
})();
</script>
