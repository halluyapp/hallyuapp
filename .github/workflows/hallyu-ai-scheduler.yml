# Hallyu AI scheduler — the 24/7 tick.
#
# Why this file must exist: `hallyu-ai-scheduler` (the edge function) authorises every call by
# verifying a GitHub OIDC token whose `job_workflow_ref` is exactly
# `<repo>/.github/workflows/hallyu-ai-scheduler.yml@<ref>`. Without this workflow in the repository
# there is no valid token, so the function rejects every request and the AI never runs on its own.
#
# The token is minted by GitHub for this job only and expires in minutes; no long-lived secret is
# stored anywhere. The function then calls the operator with its own service credential, which is
# what allows the operator to act while the owner and every admin are offline.
#
# Note on `schedule`: GitHub only fires `schedule` triggers from the repository's default branch.
# `workflow_dispatch` works from any branch, which is how the loop is verified before merge.

name: Hallyu AI scheduler

on:
  schedule:
    # Every five minutes is GitHub's floor. It drains the DM and mention queue and runs due
    # schedules; a database webhook on hallyu_ai_event is the path to sub-second wake-ups.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token the scheduler function verifies

concurrency:
  group: hallyu-ai-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The project URL is public and already committed in the app, so the tick never depends on a
      # repository secret being configured; an explicit secret still wins if one is set.
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ltyymanoidagwsapgiql.supabase.co' }}
      SCHEDULER_AUDIENCE: hallyu-ai-scheduler
    steps:
      - name: Mint the GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        env:
          AUDIENCE: ${{ env.SCHEDULER_AUDIENCE }}
        with:
          script: |
            const token = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run due AI schedules
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"action":"schedule.run_due"}' \
            "${SUPABASE_URL%/}/functions/v1/hallyu-ai-scheduler")"
          echo "scheduler HTTP ${status}"
          cat "$body_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "The scheduler rejected this run (HTTP ${status})." >&2
            exit 1
          fi
