name: Backend verification

# Proves the Hallyu backend actually works, in three clearly separated layers:
#
#   offline    — always runs, needs no project: SQL invariants, type contract, capability surface,
#                secret scan, typecheck/lint — AND the migrations are applied to a real PostgreSQL,
#                every function body is compiled, and the backend behaviour checks are replayed
#                against that database. A SQL parser cannot see inside a function body, so this is
#                the only place a body-level regression is caught before it reaches the project.
#   migrate    — brings the LIVE project in step with supabase/migrations, in filename order, before
#                anything is tested against it. The repository owns the schema; without this the live
#                suite proves an older branch's behaviour and reports it as this branch's failures.
#                Needs the privileged SUPABASE_DB_URL secret — CI only, never in a client bundle.
#   connected  — the live suite against the real project (scripts/verify-backend.mjs). REQUIRED
#                REPOSITORY SECRETS: the Supabase URL + anon key + service-role key. Missing =
#                configuration failure (red), never a silent skip. This job gates the backend.
#   rork-auth  — the OPTIONAL Rork OAuth leg (Google/Apple sign-in), isolated on purpose: it needs
#                a human-minted RORK_TEST_REFRESH_TOKEN, so its absence cannot masquerade as a
#                broken backend. When the credentials ARE configured, the Rork suite runs here and
#                fails the workflow if the exchange breaks.
#
# Secret naming: the repository stores the client-safe connection values under the SAME names the
# Expo build consumes (EXPO_PUBLIC_*) so one Supabase project serves builds and verification. This
# workflow maps them onto the verification script's backend-only env names. RORK-CREDENTIALS.md is
# the authoritative inventory.

on:
  workflow_dispatch:
  # Any change that can move the backend contract re-verifies the live project: migrations, edge
  # functions, the type contract, the verification scripts themselves, the client API layer and the
  # dependency set. (The GitHub App used by this workspace cannot dispatch workflows directly, so a
  # push trigger is also what makes verification automatic rather than manual.)
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - 'lib/api/**'
      - 'lib/sync.ts'
      - 'lib/auth.tsx'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/backend-verification.yml'
  schedule:
    # 04:23 UTC on Mondays — after the retention purge window, before anyone looks at it.
    - cron: '23 4 * * 1'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline validation (no credentials)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # A real PostgreSQL, not a parser: the migrations have to EXECUTE, and every function body has
    # to compile and plan. Nothing here touches the live project or any credential.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      HALLYU_LOCAL_DB: hallyu

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: supabase-js builds its Realtime client at createClient() time and needs a
          # native WebSocket; Node 20 has none, which reads as a backend failure when it is not.
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migrations (SQL parse + RLS + security invariants)
        run: node scripts/verify-sql.mjs

      - name: Check the type contract against the migrations
        run: node scripts/verify-db-types.mjs

      - name: Check the backend capability surface
        run: node scripts/verify-backend-surface.mjs

      - name: Scan the repository for committed credentials
        run: node scripts/verify-no-secrets.mjs

      - name: Apply every migration to a real PostgreSQL
        run: node scripts/localdb/apply.mjs "$GITHUB_WORKSPACE"

      - name: Replay the backend behaviour checks against that database
        run: node scripts/localdb/check.mjs "$GITHUB_WORKSPACE"

      - name: Compile and plan every function body
        run: node scripts/localdb/surface.mjs

      - name: Typecheck, lint and unit checks
        run: npm run check

  migrate:
    name: Apply migrations to the live project
    needs: offline
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      # The one privileged connection this repository needs. It is the project's Postgres URL, it
      # exists only inside this job, and it must never reach the APK or any client bundle — that is
      # why it is a repository secret and not an EXPO_PUBLIC_* value. Set it once, from the project's
      # Settings → Database → Connection string (the pooled URI on port 5432 is enough).
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mask the database URL in the log
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: echo "::add-mask::$SUPABASE_DB_URL"

      - name: Apply every migration in filename order
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && node scripts/verify-schema-sync.mjs "$GITHUB_WORKSPACE" | tee migrate.log; then
              echo "::notice title=Schema already in sync::SUPABASE_DB_URL is not configured, and verify-schema-sync proved the live project already implements every migration function in this branch."
              exit 0
            fi
            echo "::error title=Schema sync blocked::SUPABASE_DB_URL is not configured and the live project is behind supabase/migrations. Add SUPABASE_DB_URL under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Database credential present — the live project will be brought up to this branch."
          node scripts/ci/apply-migrations.mjs "$GITHUB_WORKSPACE" | tee migrate.log

      - name: Write the apply summary
        if: always()
        run: |
          {
            echo "## Migrations applied to the live project"
            echo ""
            echo '```text'
            cat migrate.log 2>/dev/null | head -200 || echo "(the apply step did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  connected:
    name: Connected backend (live project)
    needs: [offline, migrate]
    # The live suite runs even when the apply step could not: a project that is behind needs its
    # drift reported by name, not hidden behind the failure of the step that would have fixed it.
    # It still waits for `offline`, so a broken migration set never reaches the live project.
    if: ${{ always() && needs.offline.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      # Credentials exist only as environment variables inside this job. They are masked before any
      # command runs, are never echoed, and are never written to the repository or the summary.
      # EXPO_PUBLIC_* → script names: one underlying Supabase project, no duplicated credentials.
      # This job requires ONLY the Supabase trio; the Rork leg lives in its own job below.
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: supabase-js builds its Realtime client at createClient() time and needs a
          # native WebSocket; Node 20 has none, which reads as a backend failure when it is not.
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Mask secrets in the log
        run: |
          echo "::add-mask::$SUPABASE_URL"
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Configuration gate: a missing secret is a RED configuration failure, not a skip ────────
      - name: Require the repository secrets
        run: |
          missing=""
          if [ -z "$SUPABASE_URL" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Configuration failure::Connected verification cannot start — missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "RORK-CREDENTIALS.md documents every name, where the value comes from, and who consumes it."
            exit 1
          fi
          echo "All required backend secrets are present."

      - name: Run the live backend suite
        id: live
        run: |
          set +e
          node scripts/verify-backend.mjs | tee backend-verification.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "OVERALL STATUS: PASS — the live backend behaves as this repository describes it."
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo "::error title=Configuration failure::verify-backend.mjs reports NOT CONFIGURED — the mapped secrets did not reach the environment."
            exit 1
          fi
          echo "::error title=Backend failure::The live suite FAILED (exit $code) — failing checks are listed in the job summary."
          grep "✗" backend-verification.log | head -25 | while IFS= read -r line; do echo "::error title=Check failed::$line"; done
          exit 1

      # Why the suite failed, stated in terms the repository can answer: which function the project
      # does not have. Runs even when the suite failed, because a project provisioned from an older
      # branch is the single most common cause of a wall of failures here.
      - name: Compare the project against this repository's migrations
        if: always()
        run: |
          set +e
          node scripts/verify-schema-sync.mjs "$GITHUB_WORKSPACE" | tee schema-sync.log
          code=${PIPESTATUS[0]}
          if [ "$code" = "0" ]; then
            echo "The project implements every function this repository defines."
            exit 0
          fi
          if [ "$code" = "2" ]; then
            echo "::notice title=Schema comparison skipped::the connection values did not reach this step (the configuration gate above already failed)."
            exit 0
          fi
          echo "::error title=Schema drift::The project does not implement every function this repository defines — the list is in schema-sync.log. Apply supabase/migrations to the project in filename order, then re-run this workflow."
          exit 1

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Hallyu backend verification — connected"
            echo ""
            echo '```text'
            cat backend-verification.log 2>/dev/null || echo "(no log — the configuration gate failed)"
            echo '```'
            echo ""
            echo "### Project vs this repository"
            echo ""
            echo '```text'
            cat schema-sync.log 2>/dev/null || echo "(not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rork-auth:
    name: Rork Auth (optional credentials)
    needs: offline
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    env:
      # The Rork leg is optional by configuration: Google/Apple sign-in only. Email/password auth
      # is covered by the connected job. A configured-but-broken Rork credential still fails this
      # job — "optional" means "may be absent", never "may fail silently".
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
      RORK_TEST_REFRESH_TOKEN: ${{ secrets.RORK_TEST_REFRESH_TOKEN }}
      RORK_AUTH_URL: ${{ secrets.EXPO_PUBLIC_RORK_AUTH_URL }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: supabase-js builds its Realtime client at createClient() time and needs a
          # native WebSocket; Node 20 has none, which reads as a backend failure when it is not.
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Mask secrets in the log
        run: |
          echo "::add-mask::$SUPABASE_URL"
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$RORK_APP_KEY"
          echo "::add-mask::$RORK_TEST_REFRESH_TOKEN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the optional Rork credentials
        id: config
        run: |
          if [ -n "$RORK_APP_KEY" ] && [ -n "$RORK_TEST_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Rork credentials are configured — the exchange will be verified."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Optional Rork credentials absent::EXPO_PUBLIC_RORK_APP_KEY / RORK_TEST_REFRESH_TOKEN are not configured. The Google/Apple token-exchange leg is not exercised in this run; email/password authentication is covered by the connected job. Mint a refresh token with one interactive Rork sign-in and add it under Settings → Secrets and variables → Actions."
          fi

      - name: Run the Rork Auth suite
        id: rork
        if: steps.config.outputs.configured == 'true'
        run: |
          set +e
          node scripts/verify-rork-auth.mjs | tee rork-auth.log
          code=${PIPESTATUS[0]}
          if [ "$code" = "0" ]; then exit 0; fi
          echo "::error title=Authentication failure::The Rork Auth exchange FAILED (exit $code). Mint a fresh RORK_TEST_REFRESH_TOKEN (one interactive sign-in) and update the secret. See RORK-CREDENTIALS.md."
          exit 1

      - name: Write the run summary
        if: always()
        run: |
          {
            echo "## Hallyu backend verification — Rork Auth (optional)"
            echo ""
            if [ "${{ steps.config.outputs.configured }}" = "true" ]; then
              echo '```text'
              cat rork-auth.log 2>/dev/null || echo "(no log)"
              echo '```'
            else
              echo "Not configured in this repository: the optional Rork credentials are absent, so the Google/Apple token-exchange leg did not run. Email/password authentication is covered by the connected job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# ────────────────────────────────────────────────────────────────────────────────────────────────
# Repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#
#   REQUIRED for the connected job:
#     EXPO_PUBLIC_SUPABASE_URL       https://<project-ref>.supabase.co          (client-safe)
#     EXPO_PUBLIC_SUPABASE_ANON_KEY  the project's publishable/anon key          (client-safe)
#     SUPABASE_SERVICE_ROLE_KEY      privileged key — CI only, never in a client bundle
#
#   REQUIRED for the migrate job (applies supabase/migrations to the live project):
#     SUPABASE_DB_URL                the project's Postgres URI — privileged, CI only, never in the
#                                    APK and never an EXPO_PUBLIC_* value (Rork Cloud → project →
#                                    Database → Connection string; the pooled URI on port 5432 is
#                                    enough). Without it the project cannot be brought forward.
#
#   OPTIONAL, used by the isolated rork-auth job (Google/Apple sign-in):
#     EXPO_PUBLIC_RORK_APP_KEY       Rork app key (client-safe; identifies the app for Rork Auth)
#     RORK_TEST_REFRESH_TOKEN        refresh token for a real Rork test member (one interactive
#                                    sign-in mints it; rotate any time)
#     EXPO_PUBLIC_RORK_AUTH_URL      optional issuer override (default https://api.rork.com)
#
#   REQUIRED for connected APK builds (build-apk.yml), not here:
#     EXPO_PUBLIC_MEDIA_BUCKET       the private storage bucket name (defaults to `media`)
#
# Never commit any of these. `.gitignore` blocks `.env*` apart from `.env.example`.
# RORK-CREDENTIALS.md is the complete inventory.
# ────────────────────────────────────────────────────────────────────────────────────────────────
