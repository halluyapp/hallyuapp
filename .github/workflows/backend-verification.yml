# Backend verification — proves the Rork Cloud backend is LIVE from GitHub, on every push.
#
# The database itself is managed by Rork (migrations in the Rork project's `backend/migrations/`
# are applied with `rork supabase migrate`; there is no CI migration job and no SUPABASE_DB_URL).
# This workflow only verifies, honestly, that the deployed backend answers real API calls.
#
# Needs NO repository secrets: the job authenticates to the backend's `ci-gateway` edge function
# with its short-lived GitHub OIDC token, which hands over the client-safe connection values
# (backend URL + anon key — the same values every shipped APK embeds). The probes then run from
# the runner exactly as a phone would run them.

name: Backend verification

on:
  workflow_dispatch:
    inputs:
      validate_rork_model:
        description: Also run one bounded Rork model health check through GitHub OIDC
        required: false
        default: false
        type: boolean
      validate_ai_operator:
        description: Dispatch due AI schedules for a supervised operator validation
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master, 'arena/**']
  schedule:
    - cron: '0 6 * * 1' # weekly heartbeat, Monday 06:00 UTC

permissions:
  contents: read
  id-token: write

env:
  CI_GATEWAY_URL: https://ltyymanoidagwsapgiql.supabase.co/functions/v1/ci-gateway

jobs:
  verify:
    name: Backend is live
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: No secrets in the repo (source scan)
        run: |
          if [ -f scripts/verify-no-secrets.mjs ]; then
            node scripts/verify-no-secrets.mjs "$GITHUB_WORKSPACE"
          else
            echo "::notice::scripts/verify-no-secrets.mjs not present — skipping."
          fi

      - name: Fetch connection values (GitHub-OIDC → gateway)
        run: node scripts/ci/ci-gateway-client.mjs client-env

      - name: Mask the client-safe credentials in logs
        run: |
          echo "::add-mask::$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          echo "::add-mask::$EXPO_PUBLIC_RORK_APP_KEY"

      - name: Anonymous RPC round trip (handle_is_available)
        run: |
          CODE=$(curl -s -o /tmp/probe1.json -w '%{http_code}' \
            -X POST "${EXPO_PUBLIC_SUPABASE_URL}/rest/v1/rpc/handle_is_available" \
            -H "apikey: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_handle":"hallyu-probe"}')
          echo "handle_is_available → HTTP $CODE: $(cat /tmp/probe1.json)"
          [ "$CODE" = "200" ] || { echo "::error title=Backend unreachable::handle_is_available returned HTTP $CODE"; exit 1; }

      - name: Release channel answers (get_latest_app_release — universal-only shape)
        run: |
          CODE=$(curl -s -o /tmp/probe2.json -w '%{http_code}' \
            -X POST "${EXPO_PUBLIC_SUPABASE_URL}/rest/v1/rpc/get_latest_app_release" \
            -H "apikey: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "get_latest_app_release → HTTP $CODE: $(cat /tmp/probe2.json)"
          [ "$CODE" = "200" ] || { echo "::error title=Release RPC failed::HTTP $CODE"; exit 1; }
          jq -e '.universal_only == true' /tmp/probe2.json >/dev/null \
            || { echo "::error title=Unexpected release shape::expected universal_only: true"; exit 1; }

      - name: AI operator reaches application-level Rork auth (anonymous rejection)
        run: |
          CODE=$(curl -s -o /tmp/ai-anon.json -w '%{http_code}' \
            -X POST "${EXPO_PUBLIC_SUPABASE_URL}/functions/v1/hallyu-ai-operator" \
            -H "apikey: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${EXPO_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"action":"ping"}')
          echo "hallyu-ai-operator anonymous ping → HTTP $CODE: $(cat /tmp/ai-anon.json)"
          [ "$CODE" = "401" ] || { echo "::error title=AI transport failure::expected application-level 401, got HTTP $CODE"; exit 1; }
          jq -e '.error == "sign in required"' /tmp/ai-anon.json >/dev/null \
            || { echo "::error title=AI gateway rejection::the operator's own JSON auth response was not reached"; exit 1; }

      - name: Result
        run: echo "::notice title=Backend live::$EXPO_PUBLIC_SUPABASE_URL answered every probe (universal-only release channel and AI application-auth transport verified)."

  validate-ai:
    name: Supervised AI validation
    if: inputs.validate_rork_model || inputs.validate_ai_operator
    runs-on: ubuntu-22.04
    steps:
      - name: Rork model validation
        if: inputs.validate_rork_model
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hallyu-ai-scheduler" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          curl -fsS -X POST "https://ltyymanoidagwsapgiql.supabase.co/functions/v1/hallyu-ai-scheduler" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"model.validate"}'

      - name: AI operator validation
        if: inputs.validate_ai_operator
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hallyu-ai-scheduler" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          curl -fsS -X POST "https://ltyymanoidagwsapgiql.supabase.co/functions/v1/hallyu-ai-scheduler" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"operator.validate"}'
