name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

      # Android build compatibility
      ANDROID_NDK_VERSION: "26.1.10909125"

      # Catalog (TMDB). Read-only public credentials; empty values are ignored (they never blank
      # the built-in key in constants/keys.ts).
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}

      # Backend connection (Rork Cloud / Supabase) — client-safe values ONLY. Metro inlines
      # EXPO_PUBLIC_* at build time, so an APK built without these has no backend at runtime and
      # the connection gate honestly reports local mode. Never add the service-role key, TMDB
      # server credentials or push tokens here: those are server-side only
      # (docs/BACKEND-CREDENTIALS.md).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
      EXPO_PUBLIC_MEDIA_BUCKET: ${{ secrets.EXPO_PUBLIC_MEDIA_BUCKET }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # BUN
      # ============================================================
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ============================================================
      # CONFIGURATION GATE
      # ============================================================
      # A release APK must be a CONNECTED build: the four client-safe values below are the only
      # backend configuration that may ever enter this job (never the service-role key, never the
      # Rork test token — see RORK-CREDENTIALS.md). Missing values are a red configuration failure,
      # not a silent local-mode build.
      - name: Require the client-safe backend configuration
        run: |
          missing=""
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$EXPO_PUBLIC_MEDIA_BUCKET" ]; then missing="$missing EXPO_PUBLIC_MEDIA_BUCKET"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Configuration failure::This build would ship without a backend — missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions (RORK-CREDENTIALS.md documents every name)."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_RORK_APP_KEY" ]; then
            echo "::warning title=Optional credential absent::EXPO_PUBLIC_RORK_APP_KEY is not configured — email/password auth ships, Google/Apple sign-in is unavailable in this APK."
          fi
          echo "Client-safe backend configuration present."

      # ============================================================
      # TYPECHECK
      # ============================================================
      - name: Typecheck
        run: npm run typecheck

      # RENDER-LOOP GUARD
      # Home once entered an unbounded render loop, which left every JS-driven interaction
      # (onPress, text input, navigation) dead while native scrolling still worked. Never ship an
      # APK that can do that again.
      - name: Verify Home cannot enter a render loop
        run: npm run test:home-render

      # COMMIT TRACEABILITY
      # The installed APK must be attributable to exactly one commit.
      - name: Record the source commit
        run: |
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Building commit $SOURCE_SHORT on $SOURCE_REF"

      # ============================================================
      # EXPO PREBUILD
      # ============================================================
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      # ============================================================
      # VERIFY GENERATED ANDROID PROJECT
      # ============================================================
      - name: Verify generated Android project
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle

      # ============================================================
      # ANDROID TOOL VERSIONS
      # ============================================================
      - name: Show Android tool versions
        working-directory: android
        run: |
          ./gradlew --version

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      # ============================================================
      # GRADLE CACHE
      # ============================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # RELEASE APK BUILD
      # ============================================================
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -f app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # APK INSTALL / SIGNATURE / BUNDLE VERIFICATION
      # ============================================================
      - name: Verify release APK (install-safety)
        working-directory: android
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"

          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          echo "— zipalign (4-byte) —"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          echo "zipalign: OK"

          echo "— signature (v1 + v2) —"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

          echo "— embedded JS bundle —"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || {
            echo "::error::assets/index.android.bundle missing — the app would white-screen on launch."
            exit 1
          }

          echo "JS bundle: present"

          echo "— manifest sanity (package / sdk / launcher) —"
          "$BT/aapt2" dump badging "$APK" |
            grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity" |
            head -6

          echo "APK install-safety verification passed."

      # ============================================================
      # BAKED CONFIGURATION VERIFICATION
      # ============================================================
      # Read the values Metro actually inlined: the right Supabase project, no stale project, no dev
      # host, no privileged marker. Ran on the artifact, not on the workflow's intentions.
      - name: Verify the APK's baked backend configuration
        run: node scripts/ci/verify-apk-config.mjs android/app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # KVM
      # ============================================================
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # ============================================================
      # DEVICE TEST ACCOUNT (created for this run, removed at the end)
      # ============================================================
      - name: Create the device-test member
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs create

      # ============================================================
      # EMULATOR BOOT + AUTH FLOW TEST
      # ============================================================
      - name: Verify release APK boot and authentication on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # "yes" when the backend secrets were baked into this build — the boot gate then also
          # asserts the connection gate reached "connected" (a real backend RPC round trip). A
          # connected build that falls back to local mode fails the build instead of passing.
          CONNECTED_BUILD: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL != '' && secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY != '' && 'yes' || 'no' }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # One command line (the action splits multiple lines): boot gate first, then the auth flow
          # — sign in with this run's member through the real UI, restart, require a restored session.
          script: sh scripts/ci/boot-check.sh && node scripts/ci/auth-flow-check.mjs

      # ============================================================
      # DEVICE → BACKEND PROOF
      # ============================================================
      # The app recorded `auth.signin` through the authenticated record_event RPC; the row must exist
      # on the backend, owned by this run's member. Independent evidence that the device wrote.
      - name: Verify the device actually reached the backend
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs verify

      - name: Remove the device-test member
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs cleanup

      # ============================================================
      # BOOT LOG ARTIFACT
      # ============================================================
      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
            logcat-boot-trail.txt
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # GRADLE DIAGNOSTICS
      # ============================================================
      - name: Print Gradle diagnostics on failure
        if: failure()
        working-directory: android
        run: |
          echo "Gradle version:"
          ./gradlew --version || true

          echo "Generated Android configuration:"
          grep -RInE \
            "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion" \
            . \
            --exclude-dir=.gradle \
            --exclude='*.lock' || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

      # ============================================================
      # PREPARE APK ARTIFACT
      # ============================================================
      - name: Prepare artifact
        run: |
          set -euo pipefail

          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk

          ls -lh hallyu.apk

          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

          # The release note carries the commit so an installed APK can always be traced back.
          echo "APK built from commit \`$SOURCE_COMMIT\` (\`$SOURCE_REF\`), $(du -h hallyu.apk | cut -f1)." >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Built from commit ${SOURCE_COMMIT} (${SOURCE_REF}).

          Commit: ${SOURCE_COMMIT} (${SOURCE_REF}).


          Connected build: accounts, profiles, posts, comments, reactions, saves, follows,
          watchlists, notifications, collections and the connection gate all run against the Hallyu
          backend on Rork Cloud (Supabase). The catalog is served by the backend's TMDB ingest
          pipeline, not read from TMDB by the device. The artifact check above proves the APK
          carries exactly this project's client-safe configuration and no privileged credential.

          Install: download APK → allow unknown apps → open file."
