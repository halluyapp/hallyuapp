# Universal-only Android release pipeline.
#
# Builds ONE signed APK that installs on EVERY Android device (arm64-v8a, armeabi-v7a,
# x86_64, x86) and publishes it to the backend's public `app-releases` storage bucket under
# ONE stable object name (`hallyu-universal-latest.apk`). A database trigger on the bucket
# (migration 59) deletes every other object on each new upload, so storage can never fill
# again and no stale per-ABI split can ever be served. The release is registered through the
# service-role-only `publish_app_release` RPC, which the in-app updater reads via
# `get_latest_app_release`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL        https://ltyymanoidagwsapgiql.supabase.co
#   EXPO_PUBLIC_SUPABASE_ANON_KEY   backend anon key (client-safe, embedded in the APK)
#   EXPO_PUBLIC_RORK_APP_KEY        Rork Auth app key (client-safe)
#   EXPO_PUBLIC_TMDB_ACCESS_TOKEN   optional (TMDB metadata)
#   EXPO_PUBLIC_TMDB_API_KEY        optional (TMDB metadata)
#   EXPO_PUBLIC_MEDIA_BUCKET        optional (defaults to `media`)
#   SUPABASE_SERVICE_ROLE_KEY       server-only: APK upload + release registration
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64     optional (Firebase push config)

name: Build & Publish Universal APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: User-facing What's New notes (one bullet per line, optional)
        required: false
        default: ''
      publish:
        description: Publish to the backend (unchecked = build only)
        type: boolean
        required: false
        default: true
  push:
    branches: [main, master, 'arena/**']
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
  EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
  EXPO_PUBLIC_MEDIA_BUCKET: ${{ secrets.EXPO_PUBLIC_MEDIA_BUCKET }}
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    name: Universal APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Require the secrets a releasable build needs
        run: |
          missing=""
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$EXPO_PUBLIC_RORK_APP_KEY" ]; then missing="$missing EXPO_PUBLIC_RORK_APP_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Materialize Firebase config & permanent release keystore (ephemeral runner only)
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/load-build-secrets.mjs

      - name: Configure universal-only packaging (disable every ABI split)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          # One APK for every device: disable ABI splits (if present) and drop redundant
          # universalApk inclusion, so `assembleRelease` emits a single multi-abi APK.
          s = re.sub(r'(splits\s*\{)', r'\1 ', s)  # keep block; edits below neutralize it
          s = re.sub(r'(\bsplits\s*\{[^{}]*)enable\s+true', r'\1enable false', s, flags=re.S)
          s = re.sub(r'\buniversalApk\s+true', 'universalApk false', s)
          s = re.sub(r'\babiFilters[^\n]*\n', '', s)
          p.write_text(s)
          print('splits disabled — assembleRelease now produces one universal APK')
          PY
          test -f android/gradlew && test -f android/settings.gradle

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (universal)
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace | tee /tmp/gradle.log
          cd ..
          APK=$(ls android/app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error title=No APK produced::android/app/build/outputs/apk/release/ is empty."
            exit 1
          fi
          cp "$APK" /tmp/hallyu-universal-latest.apk
          echo "Built $(du -h /tmp/hallyu-universal-latest.apk | cut -f1) universal APK"

      - name: Read version + fingerprint
        id: meta
        run: |
          VERSION_CODE=$(grep -E '^\s*versionCode\s' android/app/build.gradle | head -1 | grep -oE '[0-9]+' | head -1)
          VERSION_NAME=$(grep -E '^\s*versionName\s' android/app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          SHA256=$(sha256sum /tmp/hallyu-universal-latest.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s /tmp/hallyu-universal-latest.apk)
          [ -n "$VERSION_CODE" ] || { echo "::error title=versionCode missing::"; exit 1; }
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Universal APK v$VERSION_NAME ($VERSION_CODE) — sha256 $SHA256, $SIZE bytes"

      - name: Publish to the backend (stable object — the trigger prunes every other file)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          STATUS=$(curl -s -o /tmp/upload.json -w '%{http_code}' \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/app-releases/hallyu-universal-latest.apk" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @/tmp/hallyu-universal-latest.apk)
          echo "upload status: $STATUS"
          cat /tmp/upload.json
          case "$STATUS" in 200|201) ;; *) echo "::error title=APK upload failed::HTTP $STATUS"; exit 1 ;; esac

      - name: Register the release (service-role RPC; in-app updater reads it)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GIT_SHA: ${{ github.sha }}
        run: |
          BODY=$(jq -n \
            --argjson vc "${VERSION_CODE:-0}" \
            --arg vn "$VERSION_NAME" \
            --arg sha "$SHA256" \
            --argjson size "${SIZE:-0}" \
            --arg notes "${RELEASE_NOTES:-Signed Hallyu update — faster feeds, stability fixes.}" \
            --arg commit "$GIT_SHA" \
            '{p_version_code: $vc, p_version_name: $vn, p_sha256: $sha, p_file_size_bytes: $size, p_release_notes: $notes, p_git_commit: $commit}')
          STATUS=$(curl -s -o /tmp/rpc.json -w '%{http_code}' \
            -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/publish_app_release" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "register status: $STATUS"
          cat /tmp/rpc.json
          case "$STATUS" in 200|201|204) ;; *) echo "::error title=Release registration failed::HTTP $STATUS"; exit 1 ;; esac

      - name: Verify the public download is live
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          sleep 3
          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/hallyu-universal-latest.apk"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC_URL")
          echo "public download: $CODE"
          [ "$CODE" = "200" ] || { echo "::error title=Public download not live::HTTP $CODE at $PUBLIC_URL"; exit 1; }
          echo "::notice title=Universal APK published::$PUBLIC_URL"

      - name: Upload build artifact (kept 30 days for provenance)
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-universal-apk
          path: /tmp/hallyu-universal-latest.apk
          retention-days: 30
          if-no-files-found: error
