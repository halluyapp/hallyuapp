name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK (Permanent Signed Slim + Universal)
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      ANDROID_NDK_VERSION: "26.1.10909125"

      # Catalog (TMDB) — public read-only credentials
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}

      # Client-safe Hallyu backend configuration ONLY
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
      EXPO_PUBLIC_MEDIA_BUCKET: ${{ secrets.EXPO_PUBLIC_MEDIA_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [ -d node_modules/schema-utils/node_modules/ajv ] && [ ! -e node_modules/ajv-keywords/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            ln -s ../../schema-utils/node_modules/ajv node_modules/ajv-keywords/node_modules/ajv
          fi

      - name: Require the client-safe backend configuration
        run: |
          missing=""
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$EXPO_PUBLIC_MEDIA_BUCKET" ]; then missing="$missing EXPO_PUBLIC_MEDIA_BUCKET"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Configuration failure::Missing repository secrets:$missing"
            exit 1
          fi
          echo "Client-safe backend configuration present."

      - name: Compute monotonic versionCode & commit metadata
        run: |
          BASE_CODE=$((10000 + ${{ github.run_number }} * 10))
          SLIM_CODE=$((BASE_CODE + 4))
          echo "EXPO_PUBLIC_BUILD_NUMBER=${BASE_CODE}" >> "$GITHUB_ENV"
          echo "HALLYU_SLIM_VERSION_CODE=${SLIM_CODE}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Computed base versionCode=${BASE_CODE}, slim ARM64 versionCode=${SLIM_CODE}"

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Home cannot enter a render loop
        run: npm run test:home-render

      - name: Materialize Firebase config & permanent release keystore (ephemeral runner only)
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci/load-build-secrets.mjs

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure permanent 4096-bit release keystore & Slim ARM64 + Universal splits
        run: node scripts/ci/configure-android-release.mjs

      - name: Verify generated Android project
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build signed release APKs (Slim ARM64 + Universal)
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

          ls -lh app/build/outputs/apk/release/

          cp app/build/outputs/apk/release/app-universal-release.apk app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Verify release APKs & permanent SHA-256 certificate
        working-directory: android
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          EXPECTED_HEX="6420be5bcfb5eab5d73a74ba06b79436fc68b2697e3e6336164b7451cb1531da"

          for APK in app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/apk/release/app-release.apk; do
            echo "=== Verifying $APK ($(du -h "$APK" | cut -f1)) ==="
            "$BT/zipalign" -c -v 4 "$APK" >/dev/null
            "$BT/apksigner" verify --verbose "$APK"
            CERTS=$("$BT/apksigner" verify --print-certs "$APK")
            echo "$CERTS" | head -6
            echo "$CERTS" | tr -d ':' | grep -iq "$EXPECTED_HEX" || {
              echo "::error::APK signature fingerprint mismatch! Got: $CERTS"
              exit 1
            }
            unzip -l "$APK" | grep -q "assets/index.android.bundle"
          done
          echo "Both Slim ARM64 & Universal APKs verified with Hallyu permanent release key!"

      - name: Verify the APK's baked backend configuration
        run: node scripts/ci/verify-apk-config.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Create the device-test member
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs create

      - name: Verify release APK boot and authentication on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CONNECTED_BUILD: "yes"
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh scripts/ci/boot-check.sh && node scripts/ci/auth-flow-check.mjs

      - name: Verify the device actually reached the backend
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs verify

      - name: Remove the device-test member
        if: always() && env.HALLYU_TEST_USER_ID != ''
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/test-account.mjs cleanup

      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
            logcat-boot-trail.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Slim & Universal APK artifacts
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk hallyu-slim.apk
          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk
          ls -lh hallyu-slim.apk hallyu.apk
          echo "SLIM_SIZE=$(du -h hallyu-slim.apk | cut -f1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: |
            hallyu-slim.apk
            hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HALLYU_PAGES_TOKEN: ${{ secrets.HALLYU_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-${{ github.run_number }}"
          NOTES="Permanent-Key Signed Hallyu Release (#${{ github.run_number }}).

          • **Web App & iOS PWA**: https://hallyuapp.github.io
          • **Fast Phone Download (Recommended — ARM64)**: \`hallyu-slim.apk\` (${SLIM_SIZE})
          • **Universal Build (All CPUs / Chromebooks)**: \`hallyu.apk\` (${APK_SIZE})
          • **In-Place Upgrade Ready**: Signed with Hallyu's permanent 4096-bit RSA key (\`64:20:BE:5B:CF:B5:EA:B5:D7:3A:74:BA:06:B7:94:36:FC:68:B2:69:7E:3E:63:36:16:4B:74:51:CB:15:31:DA\`), versionCode \`${HALLYU_SLIM_VERSION_CODE}\`. Installs seamlessly right on top of previous releases without uninstalling.
          • **Commit**: \`${SOURCE_COMMIT}\` (\`${SOURCE_REF}\`)."

          gh release create "$TAG" hallyu-slim.apk hallyu.apk \
            --title "Hallyu Signed Release #${{ github.run_number }}" \
            --notes "$NOTES"

          # When public distribution repo hallyuapp/hallyuapp.github.io is configured, mirror the public release there too
          PUB_TOKEN=$(node -e '
            (async () => {
              let t = (process.env.HALLYU_PAGES_TOKEN || "").trim();
              const u = (process.env.SUPABASE_URL || "").trim().replace(/\/$/, "");
              const k = (process.env.SUPABASE_SERVICE_ROLE_KEY || "").trim();
              if (!t && u && k) {
                const r = await fetch(`${u}/rest/v1/ci_build_vault?select=value&key=eq.github_pages_pat`, {
                  headers: { apikey: k, Authorization: `Bearer ${k}` }
                });
                if (r.ok) { const d = await r.json(); if (d[0]?.value) t = d[0].value.trim(); }
              }
              if (t) {
                const c = await fetch("https://api.github.com/repos/hallyuapp/hallyuapp.github.io", {
                  headers: { Authorization: `Bearer ${t}`, Accept: "application/vnd.github+json" }
                });
                if (c.ok) process.stdout.write(t);
              }
            })();
          ')
          if [ -n "$PUB_TOKEN" ]; then
            echo "::add-mask::$PUB_TOKEN"
            GH_TOKEN="$PUB_TOKEN" gh release create "$TAG" hallyu-slim.apk hallyu.apk \
              --repo hallyuapp/hallyuapp.github.io \
              --title "Hallyu Signed Release #${{ github.run_number }}" \
              --notes "$NOTES" || true
            echo "PUBLIC_RELEASE_REPO=hallyuapp/hallyuapp.github.io" >> "$GITHUB_ENV"
          fi

      - name: Publish Slim & Universal APKs + latest.json to Supabase App-Releases CDN
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HALLYU_APP_VERSION: "1.0.${{ github.run_number }}"
          GITHUB_REPO_SLUG: ${{ env.PUBLIC_RELEASE_REPO || github.repository }}
          GITHUB_RELEASE_TAG: "apk-${{ github.run_number }}"
        run: node scripts/ci/publish-app-release.mjs hallyu-slim.apk hallyu.apk
