# Universal-only Android release pipeline — ZERO repository secrets.
#
# Builds ONE signed APK that installs on EVERY Android device (arm64-v8a, armeabi-v7a,
# x86_64, x86) and publishes it to the backend's public `app-releases` storage bucket under
# ONE stable object (`hallyu-universal-latest.apk`). A database trigger deletes every other
# object on each upload, so storage can never fill again and a stale per-ABI split can never
# be served. The release is registered through the service-role `publish_app_release` RPC,
# which the in-app updater reads via `get_latest_app_release`.
#
# How it works without any GitHub secret: the job mints a short-lived GitHub OIDC token
# (`permissions: id-token: write`) and the backend's `ci-gateway` edge function verifies it
# against GitHub's public JWKS for this exact repository. The gateway serves the signing
# material from the server-side `ci_build_vault` (seeding it on first run) and accepts the
# finished APK for upload — the service-role key never leaves the platform.
#
#
# Optional repository secrets (not required): none.

name: Build & Publish Universal APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: User-facing What's New notes (one bullet per line, optional)
        required: false
        default: ''
  push:
    branches: [main, master, 'arena/**']
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'lib/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  # CI gateway (GitHub-OIDC-authenticated edge function on the backend). It hands the job the
  # CLIENT-SAFE build values (backend URL, anon key, Rork app key) after verifying the workflow's
  # GitHub OIDC token — nothing sensitive is stored in this repository.
  CI_GATEWAY_URL: https://ltyymanoidagwsapgiql.supabase.co/functions/v1/ci-gateway
  # Monotonic versioning: universal APK versionCode = 20000 + run_number*10 + 5 (suffix 5 =
  # universal in the ABI train; strictly newer than every legacy 12xxx build).
  EXPO_PUBLIC_BUILD_NUMBER: ${{ 20000 + github.run_number * 10 }}
  EXPO_PUBLIC_APP_VERSION: 1.1.${{ github.run_number }}

jobs:
  build:
    name: Universal APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 build-tools;35.0.0 ndk;26.1.10909125'

      - name: Fetch client-safe backend values (GitHub-OIDC → gateway)
        run: node scripts/ci/ci-gateway-client.mjs client-env

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install
          if [ -d node_modules/schema-utils/node_modules/ajv ] && [ ! -e node_modules/ajv-keywords/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            ln -s ../../schema-utils/node_modules/ajv node_modules/ajv-keywords/node_modules/ajv
          fi

      - name: Ensure release signing material (GitHub-OIDC → backend vault)
        run: node scripts/ci/ci-gateway-client.mjs vault-ensure

      - name: Expo prebuild (generates android/ from app.json)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure universal APK + v1/v2/v3 signing + installer module
        run: node scripts/ci/configure-android-release.mjs

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build release APK (universal)
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace | tee /tmp/gradle.log
          cd ..
          APK=$(ls android/app/build/outputs/apk/release/app-universal-release.apk 2>/dev/null || ls android/app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error title=No APK produced::android/app/build/outputs/apk/release/ is empty."
            exit 1
          fi
          cp "$APK" /tmp/hallyu-universal-latest.apk
          echo "Built $(du -h /tmp/hallyu-universal-latest.apk | cut -f1) universal APK"

      - name: Read version + fingerprint
        id: meta
        run: |
          VERSION_CODE=$(( ${EXPO_PUBLIC_BUILD_NUMBER} + 5 ))
          VERSION_NAME="${EXPO_PUBLIC_APP_VERSION}"
          SHA256=$(sha256sum /tmp/hallyu-universal-latest.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s /tmp/hallyu-universal-latest.apk)
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Universal APK v$VERSION_NAME ($VERSION_CODE) — sha256 $SHA256, $SIZE bytes"

      - name: Publish to the backend (gateway uploads + registers the release)
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          NOTES="${RELEASE_NOTES:-Signed Hallyu update — one universal APK for every Android device.}"
          node scripts/ci/ci-gateway-client.mjs publish /tmp/hallyu-universal-latest.apk \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --sha256 "$SHA256" \
            --size "$SIZE" \
            --notes "$NOTES" \
            --commit "${{ github.sha }}"

      - name: Verify the public download is live
        run: |
          sleep 3
          PUBLIC_URL="${EXPO_PUBLIC_SUPABASE_URL}/storage/v1/object/public/app-releases/hallyu-universal-latest.apk"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$PUBLIC_URL")
          echo "public download: $CODE"
          [ "$CODE" = "200" ] || { echo "::error title=Public download not live::HTTP $CODE at $PUBLIC_URL"; exit 1; }
          echo "::notice title=Universal APK published::$PUBLIC_URL"

      - name: Upload build artifact (kept 30 days for provenance)
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-universal-apk
          path: /tmp/hallyu-universal-latest.apk
          retention-days: 30
          if-no-files-found: error
