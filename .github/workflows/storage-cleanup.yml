name: Storage cleanup (app-releases)

# Manual only. Run `dry-run` first, read the plan in the step summary, then run `apply`.
# Touches only the public `app-releases` bucket. Never the `media` bucket, tables, or auth.
on:
  # TEMPORARY push trigger (workflow_dispatch was refused by the sandbox token). Mode comes from
  # .github/storage-cleanup/mode.txt. Remove this block once the cleanup is finished.
  push:
    branches: [arena/c5e9499c-grok-hallyu]
    paths: [".github/storage-cleanup/mode.txt"]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the plan and verifies bytes; apply performs it"
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run storage cleanup
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLEANUP_MODE: ${{ inputs.mode }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            CLEANUP_MODE="$(tr -d '[:space:]' < .github/storage-cleanup/mode.txt)"
            export CLEANUP_MODE
          fi
          node scripts/ci/storage-cleanup.mjs
