name: Deploy Hallyu Web & PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Live Hallyu Web App + PWA
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      EXPO_PUBLIC_APP_VERSION: "1.0.${{ github.run_number }}"
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
      EXPO_PUBLIC_MEDIA_BUCKET: ${{ secrets.EXPO_PUBLIC_MEDIA_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [ -d node_modules/schema-utils/node_modules/ajv ] && [ ! -e node_modules/ajv-keywords/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            ln -s ../../schema-utils/node_modules/ajv node_modules/ajv-keywords/node_modules/ajv
          fi

      - name: Export Live GitHub Pages Bundle (/hallyuapp)
        env:
          EXPO_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          GITHUB_REPOSITORY_OWNER: "${{ github.repository_owner }}"
        run: |
          set -euo pipefail
          npx expo export --platform web --output-dir dist-pages --clear
          node scripts/ci/enhance-web-html.mjs dist-pages

          test -f dist-pages/index.html
          test -f dist-pages/404.html
          test -f dist-pages/.nojekyll
          test -f dist-pages/manifest.json
          test -f dist-pages/sw.js
          test -f dist-pages/.well-known/assetlinks.json
          grep -q "apple-mobile-web-app-capable" dist-pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

      - name: Deploy Live Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish mirror bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          force_orphan: true

      - name: Also export & deploy clean root bundle when hallyuapp.github.io is configured
        env:
          EXPO_PUBLIC_BASE_PATH: ""
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HALLYU_PAGES_TOKEN: ${{ secrets.HALLYU_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          npx expo export --platform web --output-dir dist-root --clear
          node scripts/ci/enhance-web-html.mjs dist-root

      - name: Audit 360x800 mobile viewport routes, Admin Studio bounds & zero runtime errors
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p /tmp/pw-ci && npm --prefix /tmp/pw-ci install --no-save playwright-core >/dev/null
          NODE_PATH="/tmp/pw-ci/node_modules" node -e '
            const http = require("http");
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const { chromium } = require("playwright-core");
            const { createClient } = require("./node_modules/@supabase/supabase-js");
            (async () => {
              const admin = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
                auth: { persistSession: false, autoRefreshToken: false },
              });
              const tag = crypto.randomBytes(3).toString("hex");
              const email = `pw.admin.${tag}@example.invalid`;
              const password = `PwAudit!${tag}#9a`;
              const handle = `pw_adm_${tag}`;
              const created = await admin.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
                user_metadata: { handle, display_name: "PW Admin" },
              });
              if (created.error) throw new Error(created.error.message);
              const uid = created.data.user.id;
              await admin.from("profiles").update({
                handle,
                display_name: "PW Admin",
                role: "admin",
                account_status: "active",
              }).eq("id", uid);

              const memberClient = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY, {
                auth: { persistSession: false, autoRefreshToken: false },
              });
              const signedIn = await memberClient.auth.signInWithPassword({ email, password });
              if (signedIn.error || !signedIn.data.session) throw new Error(signedIn.error?.message || "No session");
              await memberClient.rpc("complete_onboarding", {
                p_worlds: ["kdrama", "anime"],
                p_genres: ["Thriller", "Romance"],
                p_step: 5,
              });
              const projectRef = new URL(process.env.SUPABASE_URL).hostname.split(".")[0];
              const storageKey = `sb-${projectRef}-auth-token`;
              const sessionJson = JSON.stringify(signedIn.data.session);

              const root = path.resolve("dist-root");
              const mime = { ".html": "text/html", ".js": "application/javascript", ".css": "text/css", ".json": "application/json", ".png": "image/png", ".ttf": "font/ttf", ".otf": "font/otf", ".ico": "image/x-icon" };
              const srv = http.createServer((req, res) => {
                const clean = decodeURIComponent((req.url || "/").split("?")[0]);
                let file = path.join(root, clean === "/" ? "index.html" : clean);
                if (!fs.existsSync(file) || fs.statSync(file).isDirectory()) {
                  const htmlCandidate = file + ".html";
                  file = fs.existsSync(htmlCandidate) ? htmlCandidate : path.join(root, "index.html");
                }
                const ext = path.extname(file);
                res.writeHead(200, { "Content-Type": mime[ext] || "application/octet-stream" });
                fs.createReadStream(file).pipe(res);
              });
              await new Promise((r) => srv.listen(0, "127.0.0.1", r));
              const port = srv.address().port;
              const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox"] });
              try {
                const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
                await context.addInitScript(({ k, v }) => {
                  window.localStorage.setItem(k, v);
                }, { k: storageKey, v: sessionJson });
                const page = await context.newPage();
                const pageErrors = [];
                page.on("pageerror", (e) => pageErrors.push(e.message));

                // 1. Audit core routes on 360x800 mobile viewport with authenticated live session
                for (const route of ["/notifications", "/settings/updates", "/settings/bug-report", "/events", "/watch-party/00000000-0000-4000-8000-000000000000"]) {
                  await page.goto(`http://127.0.0.1:${port}${route}`, { waitUntil: "domcontentloaded" });
                  await page.waitForTimeout(1600);
                  console.log("360x800 OK:", route, "->", page.url());
                }

                // 2. Audit Admin Studio on 360x800: verify tablist height >= 40px, zero overlap with Megaphone card, and real clicks across tabs
                await page.goto(`http://127.0.0.1:${port}/settings/moderation?tab=broadcast`, { waitUntil: "domcontentloaded" });
                await page.waitForTimeout(2500);
                const box = await page.getByRole("tablist").boundingBox();
                const megaBox = await page.getByText("CEO Global Push Megaphone").boundingBox();
                console.log("Admin Studio 360x800 tablist bounds:", JSON.stringify(box), "| Megaphone bounds:", JSON.stringify(megaBox));
                if (!box || box.height < 40) throw new Error("Segmented tablist collapsed: " + JSON.stringify(box));
                if (megaBox && box.y + box.height > megaBox.y + 2) {
                  throw new Error("Megaphone overlapped tablist: " + JSON.stringify({ box, megaBox }));
                }
                await page.getByText(/Bugs/).first().click();
                await page.waitForTimeout(600);
                await page.getByText(/Reports/).first().click();
                await page.waitForTimeout(600);

                if (pageErrors.length > 0) throw new Error("Runtime errors: " + JSON.stringify(pageErrors));
              } finally {
                await admin.auth.admin.deleteUser(uid).catch(() => {});
                await browser.close();
                srv.close();
              }
            })().catch((err) => {
              console.error("::error::" + (err && err.stack ? err.stack : String(err)));
              process.exit(1);
            });
          '

      - name: Upload root hallyuapp.github.io static bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyuapp-github-io-site
          path: ./dist-root
          include-hidden-files: true
          retention-days: 30
