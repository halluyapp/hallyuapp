name: Deploy Hallyu Web & PWA

on:
  workflow_dispatch:
    inputs:
      run_live_browser_test:
        description: Create and remove a temporary production test member for authenticated browser checks
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "scripts/ci/android-installer-module.mjs"
      - "scripts/ci/configure-android-release.mjs"
      - "scripts/ci/publish-app-release.mjs"
      - "scripts/ci/auth-flow-check.mjs"
      - "scripts/ci/boot-check.sh"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-and-build:
    name: Gate, Build & Headless Chrome Audit
    runs-on: ubuntu-22.04

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      EXPO_PUBLIC_APP_VERSION: "1.0.${{ github.run_number }}"
      EXPO_PUBLIC_GIT_COMMIT: "${{ github.sha }}"
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
      EXPO_PUBLIC_MEDIA_BUCKET: ${{ secrets.EXPO_PUBLIC_MEDIA_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          if [ -d node_modules/schema-utils/node_modules/ajv ] && [ ! -e node_modules/ajv-keywords/node_modules/ajv ]; then
            mkdir -p node_modules/ajv-keywords/node_modules
            ln -s ../../schema-utils/node_modules/ajv node_modules/ajv-keywords/node_modules/ajv
          fi

      - name: Stamp build metadata & run full static, type, SQL & Vitest gate
        run: |
          echo "EXPO_PUBLIC_GIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          npm run check

      - name: Export & stamp GitHub Pages bundle (/hallyuapp) + clean root bundle
        env:
          GITHUB_REPOSITORY_OWNER: "${{ github.repository_owner }}"
        run: |
          set -euo pipefail
          EXPO_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}" \
            npx expo export --platform web --output-dir dist-pages --clear
          EXPO_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}" \
            node scripts/ci/enhance-web-html.mjs dist-pages

          EXPO_PUBLIC_BASE_PATH="" \
            npx expo export --platform web --output-dir dist-root --clear
          EXPO_PUBLIC_BASE_PATH="" \
            node scripts/ci/enhance-web-html.mjs dist-root

          test -f dist-pages/index.html
          test -f dist-pages/404.html
          test -f dist-pages/.nojekyll
          test -f dist-pages/manifest.json
          test -f dist-pages/sw.js
          test -f dist-pages/version.json
          test -f dist-pages/.well-known/assetlinks.json
          grep -q "${GITHUB_SHA}" dist-pages/index.html
          grep -q "${GITHUB_SHA}" dist-pages/version.json
          ! grep -q "__HALLYU_SW_BUILD_ID__" dist-pages/sw.js
          cat dist-pages/version.json

      # This authenticated browser audit creates/promotes and removes a temporary production account.
      # Run only when explicitly requested; ordinary main deployments remain data-nonmutating.
      - name: Pre-deploy Headless Chrome verification (Landing Page, SW, version.json & 360x800 routes)
        if: github.ref == 'refs/heads/main' && inputs.run_live_browser_test == true
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p /tmp/pw-ci && npm --prefix /tmp/pw-ci install --no-save playwright-core >/dev/null
          NODE_PATH="/tmp/pw-ci/node_modules" node -e '
            const http = require("http");
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const { chromium } = require("playwright-core");
            const { createClient } = require("./node_modules/@supabase/supabase-js");
            (async () => {
              const admin = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
                auth: { persistSession: false, autoRefreshToken: false },
              });
              const tag = crypto.randomBytes(3).toString("hex");
              const email = `pw.admin.${tag}@example.invalid`;
              const password = `PwAudit!${tag}#9a`;
              const handle = `pw_adm_${tag}`;
              const created = await admin.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
                user_metadata: { handle, display_name: "PW Admin" },
              });
              if (created.error) throw new Error(created.error.message);
              const uid = created.data.user.id;
              await admin.from("profiles").update({
                handle,
                display_name: "PW Admin",
                role: "admin",
                account_status: "active",
              }).eq("id", uid);

              const memberClient = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY, {
                auth: { persistSession: false, autoRefreshToken: false },
              });
              const signedIn = await memberClient.auth.signInWithPassword({ email, password });
              if (signedIn.error || !signedIn.data.session) throw new Error(signedIn.error?.message || "No session");
              await memberClient.rpc("complete_onboarding", {
                p_worlds: ["kdrama", "anime"],
                p_genres: ["Thriller", "Romance"],
                p_step: 5,
              });
              const projectRef = new URL(process.env.SUPABASE_URL).hostname.split(".")[0];
              const storageKey = `sb-${projectRef}-auth-token`;
              const sessionJson = JSON.stringify(signedIn.data.session);

              const root = path.resolve("dist-root");
              const mime = { ".html": "text/html", ".js": "application/javascript", ".css": "text/css", ".json": "application/json", ".png": "image/png", ".ttf": "font/ttf", ".otf": "font/otf", ".ico": "image/x-icon" };
              const srv = http.createServer((req, res) => {
                const clean = decodeURIComponent((req.url || "/").split("?")[0]);
                let file = path.join(root, clean === "/" ? "index.html" : clean);
                if (!fs.existsSync(file) || fs.statSync(file).isDirectory()) {
                  const htmlCandidate = file + ".html";
                  file = fs.existsSync(htmlCandidate) ? htmlCandidate : path.join(root, "index.html");
                }
                const ext = path.extname(file);
                res.writeHead(200, { "Content-Type": mime[ext] || "application/octet-stream" });
                fs.createReadStream(file).pipe(res);
              });
              await new Promise((r) => srv.listen(0, "127.0.0.1", r));
              const port = srv.address().port;
              const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox"] });
              try {
                // 0. Unauthenticated public Landing Page & version.json check
                const pubCtx = await browser.newContext({ viewport: { width: 1280, height: 800 } });
                const pubPage = await pubCtx.newPage();
                const pubErrors = [];
                pubPage.on("pageerror", (e) => pubErrors.push(e.message));
                await pubPage.goto(`http://127.0.0.1:${port}/`, { waitUntil: "domcontentloaded" });
                await pubPage.getByText("Download Android APK").first().waitFor({ timeout: 20000 });
                const verRes = await pubPage.evaluate(async () => (await fetch("/version.json")).json());
                if (verRes.commit !== process.env.GITHUB_SHA) {
                  throw new Error("version.json mismatch: " + JSON.stringify(verRes));
                }
                if (pubErrors.length > 0) throw new Error("Landing errors: " + JSON.stringify(pubErrors));
                await pubCtx.close();

                // 1. Authenticated 360x800 mobile viewport audit
                const context = await browser.newContext({ viewport: { width: 360, height: 800 } });
                await context.addInitScript(({ k, v }) => {
                  window.localStorage.setItem(k, v);
                }, { k: storageKey, v: sessionJson });
                const page = await context.newPage();
                const pageErrors = [];
                page.on("pageerror", (e) => pageErrors.push(e.message));

                for (const route of ["/notifications", "/settings/updates", "/settings/bug-report", "/events", "/watch-party/00000000-0000-4000-8000-000000000000"]) {
                  await page.goto(`http://127.0.0.1:${port}${route}`, { waitUntil: "domcontentloaded" });
                  await page.waitForTimeout(1600);
                  console.log("360x800 OK:", route, "->", page.url());
                }

                // 2. Audit Admin Studio bounds & touch navigation
                await page.goto(`http://127.0.0.1:${port}/settings/moderation?tab=broadcast`, { waitUntil: "domcontentloaded" });
                await page.waitForTimeout(2500);
                const box = await page.getByRole("tablist").boundingBox();
                const megaBox = await page.getByText("CEO Global Push Megaphone").boundingBox();
                console.log("Admin Studio 360x800 tablist bounds:", JSON.stringify(box), "| Megaphone bounds:", JSON.stringify(megaBox));
                if (!box || box.height < 40) throw new Error("Segmented tablist collapsed: " + JSON.stringify(box));
                if (megaBox && box.y + box.height > megaBox.y + 2) {
                  throw new Error("Megaphone overlapped tablist: " + JSON.stringify({ box, megaBox }));
                }
                await page.getByText(/Bugs/).first().click();
                await page.waitForTimeout(600);
                await page.getByText(/Reports/).first().click();
                await page.waitForTimeout(600);

                // 3. Audit Commercial Admin Console (/admin) at 360x800 Mobile + 1280x800 Desktop & @ceohallyu Recognition Profile
                await page.goto(`http://127.0.0.1:${port}/admin`, { waitUntil: "domcontentloaded" });
                await page.getByText("Hallyu Admin Console").first().waitFor({ timeout: 20000 });
                const adminMobTablist = await page.getByRole("tablist").first().boundingBox();
                console.log("Commercial Admin 360x800 tablist bounds:", JSON.stringify(adminMobTablist));
                if (!adminMobTablist || adminMobTablist.height < 40) {
                  throw new Error("Admin mobile tablist collapsed: " + JSON.stringify(adminMobTablist));
                }

                await page.setViewportSize({ width: 1280, height: 800 });
                await page.goto(`http://127.0.0.1:${port}/admin`, { waitUntil: "domcontentloaded" });
                await page.getByText("COMMAND").first().waitFor({ timeout: 20000 });
                await page.getByText("Launch & Founding 10").first().click();
                await page.waitForTimeout(600);
                await page.getByText("Verification Queue").first().click();
                await page.waitForTimeout(600);
                await page.getByText("Badges & Awards").first().click();
                await page.waitForTimeout(600);
                await page.getByText("Audit Ledger").first().click();
                await page.waitForTimeout(600);

                await page.goto(`http://127.0.0.1:${port}/user/ceohallyu`, { waitUntil: "domcontentloaded" });
                await page.getByText("Architect of Hallyu").first().waitFor({ timeout: 20000 });
                const sealCount = await page.locator("svg").count();
                console.log("Desktop 1280x800 @ceohallyu SVG elements rendered:", sealCount);
                if (sealCount < 2) {
                  throw new Error("Expected SVG verification seal + badge crest on @ceohallyu profile, found: " + sealCount);
                }

                if (pageErrors.length > 0) throw new Error("Runtime errors: " + JSON.stringify(pageErrors));
              } finally {
                await admin.auth.admin.deleteUser(uid).catch(() => {});
                await browser.close();
                srv.close();
              }
            })().catch((err) => {
              console.error("::error::" + (err && err.stack ? err.stack : String(err)));
              process.exit(1);
            });
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

      - name: Upload verified dist-pages directory for gh-pages branch mirror
        uses: actions/upload-artifact@v4
        with:
          name: dist-pages-verified
          path: ./dist-pages
          include-hidden-files: true
          retention-days: 7

      - name: Upload root hallyuapp.github.io static bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyuapp-github-io-site
          path: ./dist-root
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy & Verify Live Public Website
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/c5e9499c-grok-hallyu'
    needs: verify-and-build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download verified dist-pages directory
        uses: actions/download-artifact@v4
        with:
          name: dist-pages-verified
          path: ./dist-pages

      - name: Deploy verified bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish mirror bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify live public site serves exact commit SHA & zero stale/404 bundles
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/pw-live && npm --prefix /tmp/pw-live install --no-save playwright-core >/dev/null
          NODE_PATH="/tmp/pw-live/node_modules" node -e '
            const { chromium } = require("playwright-core");
            const base = (process.env.PAGE_URL || "https://halluyapp.github.io/hallyuapp/").replace(/\/?$/, "/");
            const expected = process.env.EXPECTED_SHA;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              let liveVersion = null;
              for (let attempt = 1; attempt <= 24; attempt++) {
                try {
                  const res = await fetch(`${base}version.json?cb=${Date.now()}-${attempt}`, {
                    headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" },
                  });
                  if (res.ok) {
                    const data = await res.json();
                    console.log(`Attempt ${attempt}: live commit=${data.commit} (expected=${expected})`);
                    if (data.commit === expected) {
                      liveVersion = data;
                      break;
                    }
                  }
                } catch (err) {
                  console.log(`Attempt ${attempt} error:`, err.message);
                }
                await sleep(5000);
              }
              if (!liveVersion) {
                throw new Error(`Live site at ${base}version.json did not propagate commit ${expected} within 120s`);
              }

              const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true, args: ["--no-sandbox"] });
              try {
                const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
                const errors = [];
                const failedAssets = [];
                page.on("pageerror", (e) => errors.push(e.message));
                page.on("response", (res) => {
                  if (res.url().includes("/_expo/static/") && res.status() >= 400) {
                    failedAssets.push(`${res.status()} ${res.url()}`);
                  }
                });
                await page.goto(`${base}?verify=${Date.now()}`, { waitUntil: "domcontentloaded" });
                await page.getByText("Download Android APK").first().waitFor({ timeout: 25000 });
                const metaCommit = await page.locator("meta[name=\"hallyu-commit\"]").getAttribute("content");
                console.log("Verified live HTML meta hallyu-commit:", metaCommit);
                if (metaCommit !== expected) {
                  throw new Error(`Live HTML meta commit ${metaCommit} !== ${expected}`);
                }
                if (failedAssets.length > 0) {
                  throw new Error("Broken static assets on live site: " + JSON.stringify(failedAssets));
                }
                if (errors.length > 0) {
                  throw new Error("Runtime JS errors on live site: " + JSON.stringify(errors));
                }
                const fs = require("fs");
                if (process.env.GITHUB_STEP_SUMMARY) {
                  fs.appendFileSync(
                    process.env.GITHUB_STEP_SUMMARY,
                    `## Live Web Deployment Verified\n- **URL**: ${base}\n- **Commit**: \`${liveVersion.commit}\`\n- **Version**: \`${liveVersion.version}\`\n- **SW Build ID**: \`${liveVersion.swBuildId}\`\n- **Hashed Entry Bundles**: \`${JSON.stringify(liveVersion.entryBundles)}\`\n`,
                  );
                }
                console.log("LIVE WEB DEPLOYMENT 100% VERIFIED:", JSON.stringify(liveVersion));
              } finally {
                await browser.close();
              }
            })().catch((err) => {
              console.error("::error::" + (err && err.stack ? err.stack : String(err)));
              process.exit(1);
            });
          '

# Publishing: runs from arena/c5e9499c-grok-hallyu on push (see the publish conditions below).
