# Hallyu — Supabase project configuration.
#
# This file makes the project reproducible: `supabase start` boots the same local stack the CI
# verification expects, `supabase db reset` replays every migration in supabase/migrations, and the
# seed below loads the reference rows the application depends on. Nothing here contains a credential;
# every value is a placeholder that a future Rork project will supply through GitHub Secrets.

project_id = "hallyu"

[api]
enabled = true
# Point the local API at the local database only. The hosted project's own URL comes from
# SUPABASE_URL in CI, never from this file.
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Public schema migrations live in supabase/migrations and are applied in filename order.
major_version = 15

[db.pooler]
enabled = false
port = 54329

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "hallyu://"
# The Expo client returns from an OAuth-style browser session on these schemes. The hosted project's
# real redirect list is configured on the project itself (Rork registers the deep-link scheme).
additional_redirect_urls = ["hallyu://auth/callback", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false
# Email/password and OAuth are both enabled: the local client uses email + password, the connected
# client uses Google/Apple through Rork Auth, which exchanges an Rork JWT for a Supabase session.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
# No SMTP provider is configured on purpose — nothing in this repository may send mail.

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[storage]
enabled = true
# Matches the composer's cap (lib/media.ts VIDEO_MAX_BYTES); see migration 17 for the bucket itself.
file_size_limit = "100MiB"

[analytics]
enabled = false

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.purge-deleted-accounts]
verify_jwt = true

[functions.moderation-digest]
verify_jwt = true

# ────────────────────────────────────────────────────────────────────────────────────────────────
# Scheduled and maintenance functions.
#
# Every one of these requires the service role (checked again inside the function, on top of
# verify_jwt) and is driven by pg_cron — see the commented-out cron.schedule() blocks at the bottom
# of supabase/migrations/20260101122700_27_scheduled_jobs.sql.
#
# Required secrets (set with `supabase secrets set`, never committed):
#   SUPABASE_SERVICE_ROLE_KEY   always present as a function secret
#   TMDB_ACCESS_TOKEN           read-only TMDB v4 token (or TMDB_API_KEY for the v3 key)
#   EXPO_ACCESS_TOKEN           optional: Expo push access token for higher rate limits
#
# Everything runs correctly without a credential: catalog-sync reports 503 "not configured" and
# push-dispatch falls back to the anonymous Expo endpoint, so a fresh project is never broken by a
# missing secret.
# ────────────────────────────────────────────────────────────────────────────────────────────────

# Fetches TMDB and writes through the idempotent ingest RPCs. No business logic lives here.
[functions.catalog-sync]
verify_jwt = true

# Calls run_scheduled_jobs(); the SQL dispatcher owns the schedule, the run keys and the retries.
[functions.catalog-jobs]
verify_jwt = true

# Claims queued notifications and sends them, recording per-delivery outcomes.
[functions.push-dispatch]
verify_jwt = true

# Reconciles database media rows against objects in the `media` bucket.
[functions.media-cleanup]
verify_jwt = true

# GitHub Actions OIDC only; removes obsolete APKs through Storage after a new public upload.
[functions.release-maintenance]
verify_jwt = false

# Web auth relay for Rork Auth (api.rork.com). Called by the browser BEFORE any session exists
# (initiate / token / refresh), so JWT verification is off: Rork Auth itself rejects invalid app
# keys, and the relay adds no credentials and forwards to exactly three fixed endpoints.
[functions.auth-broker]
verify_jwt = false

# Applied by `supabase db reset` after the migrations run. Reference data only: worlds and the
# catalog providers. No member content is ever seeded.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
